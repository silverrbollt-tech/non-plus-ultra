{% extends "base.html" %}

{% block title %}Profile - Discord Clone{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-md-8">
            <div class="card" style="background-color: var(--discord-channels); border: 1px solid rgba(255, 255, 255, 0.1);">
                <div class="card-header">
                    <h4 class="text-white mb-0">Profile</h4>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-3">
                            <div class="message-avatar mx-auto" style="width: 80px; height: 80px; font-size: 32px;">
                                {{ current_user.username[0].upper() }}
                            </div>
                        </div>
                        <div class="col-md-9">
                            <h5 class="text-white">{{ current_user.username }}</h5>
                            <p class="text-muted">{{ current_user.email }}</p>
                            <p class="text-muted small">Member since {{ current_user.created_at.strftime('%B %Y') }}</p>
                            <a href="{{ url_for('main.edit_profile') }}" class="btn btn-primary btn-sm">
                                <i class="fas fa-edit me-1"></i>Edit Profile
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
